[project]
name = "qwen-qad"
version = "0.1.0"
description = "Low-bit weight quantization and online/offline QAD for Qwen3 (research pilot)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "transformers>=4.51",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
